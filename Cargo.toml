[package]
name = "gv"
version = "0.1.0"
edition = "2021"
authors = ["battle-build contributors"]
description = "Gradle View generator for Bazel projects"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
petgraph = { version = "0.6", features = ["serde-1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.36", features = ["serialize"] }
roxmltree = "0.20"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
tempfile = "3.10"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
